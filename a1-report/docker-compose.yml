# 資料夾名稱是中文，Compose 無法自動取專案名稱，所以這裡指定
name: traffic-a1-v2

services:
  # 讀本資料夾的 data.db 產生報告、用網頁開出來，並監看 data.db：
  # 你在本資料夾下載/匯入新資料後，幾十秒內會自動重新產生報告，開著的網頁會提示重新整理
  report:
    build: .
    image: traffic-a1-v2:latest
    container_name: traffic-a1-v2
    working_dir: /app
    ports:
      - "127.0.0.1:8003:8003"     # 只有這台電腦能開；要讓手機連，改成 "8003:8003"
                                  # 8001=小說爬蟲、8002=ytmusic_web，所以這裡用 8003
    volumes:
      - .:/app                    # 這個資料夾：程式、data.db、輸出(public/)全都在裡面
    environment:
      AUTO_BUILD: "1"             # 啟動時先重新產生一次(約 1 分鐘)；改成 "0" 就先用上次的 public/index.html
      AUTO_FETCH_WEATHER: "1"     # 自動下載氣象署逐日氣象資料(啟動時與每 6 小時檢查;距上次不到 20 小時會略過);改成 "0" 關閉
      WEATHER_CHECK_HOURS: "6"
      POLL_SECONDS: "15"          # 每幾秒檢查一次 data.db 有沒有變
      SETTLE_SECONDS: "20"        # 變動後等幾秒沒再變(匯入寫完)才重新產生
    restart: "no"
